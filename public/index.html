<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GURKA</title><style>body{font:16px system-ui;background:#101c24;color:#e8f4f3;margin:0}main{max-width:850px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#9befb0}section{background:#1b303b;border:1px solid #36505a;padding:16px;border-radius:15px;margin:12px 0}button,input{font:inherit;border-radius:9px;padding:11px;margin:4px;border:1px solid #57707b}button{background:#85e4ad;color:#10221b;font-weight:700;cursor:pointer}button:disabled{opacity:.4}input{background:#10242d;color:white;max-width:90%}.cards{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.card{background:#fff;color:#111;min-width:45px;height:68px;border-radius:8px;font-weight:bold;font-size:19px}.red{color:#c02e45}.selected{outline:4px solid #67d6f2;transform:translateY(-5px)}.muted{color:#a4bac1}.small{font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.score{position:fixed;right:12px;top:12px;background:#25404b;border:1px solid #6c8991;border-radius:12px;padding:12px;z-index:3;box-shadow:0 5px 30px #0008;max-width:280px}table{border-collapse:collapse;width:100%}td,th{padding:7px;border-bottom:1px solid #45606c;text-align:left}.plus{color:#82e9a2}.minus{color:#ffa3a3}#toast{color:#ffb5a6}a{color:#8de8ba} .hidden{display:none}</style><main><header><h1>♠ GURKA</h1><button onclick="toggleScore()">📊 Poengark</button></header><div id="score" class="score hidden"></div><div id="toast"></div><div id="app"></div></main><script>
let room='',token='',state=null,sel=[],busy=false;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmt=c=>c.r+c.s;const card=(c,i,click=false)=>`<button class="card ${['♥','♦'].includes(c.s)?'red':''} ${sel.includes(i)?'selected':''}" ${click?`onclick="select(${i})"`: 'disabled'}>${fmt(c)}</button>`;function toggleScore(){$('score').classList.toggle('hidden')};function select(i){sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i];render()};function toast(s){$('toast').textContent=s;setTimeout(()=>{$('toast').textContent=''},4500)};async function api(url,data){let r=await fetch('/api/'+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error);return j};async function create(){try{let a=await api('create',{name:$('name').value,x:$('x').value});login(a)}catch(e){toast(e.message)}}async function join(){try{let a=await api('join',{name:$('name').value,room:$('code').value});login(a)}catch(e){toast(e.message)}}function login(a){room=a.room;token=a.token;sessionStorage.setItem('gurka',JSON.stringify(a));sel=[];poll()};async function act(type,extra={}){if(busy)return;busy=true;try{state=await api('action',{room,token,type,...extra});sel=[];render()}catch(e){toast(e.message)}finally{busy=false}}async function poll(){if(!room)return;try{let r=await fetch('/api/state?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));let j=await r.json();if(!r.ok)throw Error(j.error);let old=state?.turn+'-'+state?.phase+'-'+state?.round;state=j;if(old!==j.turn+'-'+j.phase+'-'+j.round)sel=[];render()}catch(e){toast(e.message)}}setInterval(poll,1000);function setup(){let q=new URLSearchParams(location.search).get('room')||'';$('app').innerHTML=`<section><h2>Spill med venner</h2><p>Opprett rom, og del lenken med 1–3 andre.</p><input id="name" placeholder="Ditt navn" value=""><input id="x" type="number" min="1" value="10" placeholder="X"><button onclick="create()">Opprett rom</button><hr><input id="code" placeholder="Romkode" value="${esc(q)}"><button onclick="join()">Bli med</button></section>`};function score(){if(!state)return;let s=state;$('score').innerHTML=`<strong>Poengark · ${s.x}x</strong><table>${s.players.map(p=>`<tr><td>${esc(p.name)}</td><td class="${p.points<0?'minus':'plus'}">${Math.abs(p.points).toLocaleString('nb-NO')}${p.points<0?'-':'+'}</td></tr>`).join('')}</table><small>Runder: ${s.history.length}</small>`}
function render(){if(!state){setup();return}let s=state,m=s.me,p=s.players[m],mine=s.turn===m,html=`<section class="row"><div><b>Rom ${s.room}</b> · ${s.x}x · Runde ${s.round}</div><button onclick="navigator.clipboard.writeText(location.origin+'/?room=${s.room}').then(()=>toast('Lenke kopiert'))">Kopier invitasjonslenke</button></section><section><b>Spillere</b><div>${s.players.map((z,i)=>`<p>${i===s.turn?'▶ ':''}${esc(z.name)}: 🂠 ${z.count} kort ${z.open?' · Åpent kort '+fmt(z.open):''}</p>`).join('')}</div></section>`;
if(s.phase==='lobby')html+=`<section><h2>Venter på spillere</h2><p>${s.players.length}/4 har blitt med.</p>${m===0?`<button ${s.players.length<2?'disabled':''} onclick="act('start')">Start spillet</button>`:'Verten starter spillet.'}</section>`;
else if(s.phase==='tie')html+=`<section><h2>Lik høyeste åpningskort</h2><p>Spillerne som står likt, trekker ${s.tieDrawCount} kort for å avgjøre hvem som vinner.</p>${s.openTied.includes(m)&&!s.tieDone?`<button onclick="act('tie')">Trekk om</button>`:'Venter på omtrekning'}</section>`;
else if(s.phase==='chooseQuota')html+=`<section><h2>${esc(s.players[s.winner].name)} vant åpningsstikket</h2>${mine?`<p>Velg antall kort alle får bytte.</p><input id="quota" type="number" min="0" max="${s.players.length===4?4:7}" value="4"><button onclick="act('quota',{n:Number($('quota').value)})">Bekreft antall</button>`:'Venter på at vinneren velger antall kort.'}</section>`;
else if(s.phase==='exchange'){
html+=`<section><h2>Bytterunde · ${s.quota} kort</h2>${mine?`<p>Din tur til å bytte.</p>`:`<p>${esc(s.players[s.turn].name)} bytter nå. Du kan ikke trekke kort.</p>`}</section>`;
if(mine){if(s.exchangeStep==='pre')html+=`<section><p>Har du ingen J, D, K eller S, kan du først bytte alle 7 uten flipping og deretter delta i vanlig bytting.</p><button onclick="act('pre',{yes:true})">Bytt alle 7 (ingen bildekort)</button><button onclick="act('pre',{yes:false})">Gå videre</button></section>`;
if(s.exchangeStep==='select')html+=`<section><p>${m===s.winner?'Velg nøyaktig '+s.quota+' kort.':'Velg enten nøyaktig '+s.quota+' kort eller ingen.'} De brente kortene er skjulte.</p><button onclick="act('exchange',{indices:sel})">Bekreft ${sel.length} kort</button>${m!==s.winner?`<button onclick="act('exchange',{indices:[]})">Ikke bytt</button>`:''}</section>`;
if(s.exchangeStep==='flip')html+=`<section><h3>Trykk på kortstokken</h3><p>Flippet ${s.flips.length} av ${s.removed}. Du kan velge et kort før du har flippet alle.</p><button onclick="act('flip')" ${s.flips.length>=s.removed?'disabled':''}>🂠 FLIPP KORT</button><div class="cards">${s.flips.map((c,i)=>`<button class="card ${['♥','♦'].includes(c.s)?'red':''}" onclick="act('pick',{n:${i}})">${fmt(c)}</button>`).join('')}</div><p class="small">Trykk på kortet du vil beholde. Du får resten automatisk.</p></section>`}}
}
else if(s.phase==='play'){
let seconds=s.deadline?Math.max(0,Math.ceil((s.deadline-Date.now())/1000)):10;
html+=`<section><h2>Leggerunde</h2><h2 id="timer">⏱ ${seconds} sekunder</h2><p>${mine?'DIN TUR: Legg kort nå!':'Venter på '+esc(s.players[s.turn].name)}</p>${s.table.map(t=>`<p>${esc(s.players[t.player].name)} la:</p><div class="cards">${t.cards.map(c=>card(c,-1)).join('')}</div>`).join('')}${mine?`<p>${s.count===null?'Start med ett eller flere like kort.':'Du må legge '+s.count+' kort.'}</p><button onclick="act('play',{indices:sel})">Legg valgte (${sel.length})</button>`:''}<p class="small">Når tiden går ut, legger serveren automatisk laveste kort, eller de ${s.count||1} laveste kortene.</p></section>`}
else if(s.phase==='result'){let last=s.history.at(-1);html+=`<section><h2>🏁 Runden er ferdig!</h2><p>Høyeste kort igjen taper. Kortsum × ${s.x} gir minuspoeng. De andre får tilsvarende pluss, fordelt mellom dem.</p>${s.players.map((p,i)=>`<h3>${esc(p.name)}: ${last.scores[i]<0?Math.abs(last.scores[i])+'-':last.scores[i]+'+'}</h3><div class="cards">${last.remaining[i].map(c=>card(c,-1)).join('')||'Ingen kort'}</div>`).join('')}${m===0?`<button onclick="act('next')">Start neste runde</button>`:'Venter på neste runde'}</section>`}
if(s.phase!=='lobby'&&s.phase!=='result')html+=`<section><h3>Din hånd (${p.hand.length})</h3><div class="cards">${p.hand.map((c,i)=>card(c,i,mine&&(s.phase==='play'||(s.phase==='exchange'&&s.exchangeStep==='select')))).join('')}</div></section>`;
$('app').innerHTML=html;score()}
let saved=sessionStorage.getItem('gurka');if(saved){try{let s=JSON.parse(saved);room=s.room;token=s.token;poll()}catch(e){setup()}}else setup();setInterval(()=>{if(state?.phase==='play'&&state.deadline){let t=$('timer');if(t)t.textContent='⏱ '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+' sekunder'}},150);
</script></html>
